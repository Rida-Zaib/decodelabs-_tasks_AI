<head>

<title>ChatBot — Project 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --cream:#FBF6EA;
    --mint:#D8F0DE;
    --sky:#C3DEF7;
    --sage:#5C7A52;
    --sage-dark:#3F5A38;
    --leaf:#8CAE7B;
    --terracotta:#EDA36B;
    --ink:#33422E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--cream) 0%,var(--mint) 45%,var(--sky) 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;position:relative;overflow:hidden;
  }
  h1,h2{font-family:'Baloo 2',cursive;margin:0;}

  .blob{position:absolute;pointer-events:none;opacity:0.9;}
  .blob.tl{top:-70px;left:-70px;width:240px;}
  .blob.br{bottom:-80px;right:-80px;width:280px;transform:scaleX(-1);}
  .dots{position:absolute;top:22px;right:34px;pointer-events:none;}

  .app{
    width:min(420px,92vw);
    height:min(640px,86vh);
    background:#fff;
    border-radius:32px;
    box-shadow:0 24px 60px rgba(92,122,82,0.22);
    display:flex;flex-direction:column;
    overflow:hidden;
    position:relative;
    z-index:1;
  }

  .header{
    background:linear-gradient(120deg,var(--sage) 0%,var(--leaf) 100%);
    color:white;padding:20px 24px;
    display:flex;align-items:center;gap:12px;
  }
  .header .avatar{
    width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .header .info h1{font-size:18px;}
  .header .info .status{font-size:12.5px;opacity:0.9;display:flex;align-items:center;gap:5px;margin-top:2px;}
  .header .info .status .dot{width:7px;height:7px;border-radius:50%;background:#9CFFB0;display:inline-block;}

  .messages{
    flex:1;overflow-y:auto;padding:22px 20px;
    display:flex;flex-direction:column;gap:12px;
    background:var(--cream);
  }
  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:#d3e4c9;border-radius:10px;}

  .row{display:flex;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}

  .bubble{
    max-width:76%;padding:11px 16px;border-radius:18px;
    font-size:14.5px;line-height:1.5;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .row.bot .bubble{background:white;color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(92,122,82,0.08);}
  .row.user .bubble{background:var(--sage);color:white;border-bottom-right-radius:4px;}

  .typing{display:flex;gap:4px;padding:4px 2px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:#a9c39d;animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}

  .inputbar{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px;background:white;border-top:1px solid #eef3ea;
  }
  .inputbar input{
    flex:1;border:none;outline:none;background:var(--cream);
    padding:12px 16px;border-radius:999px;font-family:'Nunito',sans-serif;
    font-size:14.5px;color:var(--ink);
  }
  .inputbar input::placeholder{color:#9db091;}
  .inputbar button{
    width:42px;height:42px;border-radius:50%;border:none;
    background:var(--sage);color:white;font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .12s ease, transform .12s ease;
  }
  .inputbar button:hover{background:var(--sage-dark);transform:scale(1.05);}

  .voicebar{
    display:flex;align-items:center;gap:8px;
    padding:0 16px 10px;background:white;
  }
  .voicebar select{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;
    background:var(--cream);color:var(--sage-dark);border:none;
    padding:6px 10px;border-radius:999px;cursor:pointer;flex:1;
  }
  .iconbtn{
    width:32px;height:32px;border-radius:50%;border:none;
    background:var(--cream);color:var(--sage-dark);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .12s ease;
  }
  .iconbtn:hover{background:var(--mint);}
  .iconbtn.active{background:var(--terracotta);color:white;}

  .micbtn{
    width:42px;height:42px;border-radius:50%;border:none;
    background:var(--sky);color:var(--sage-dark);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .12s ease, transform .12s ease;
  }
  .micbtn:hover{background:#aecdea;}
  .micbtn.listening{
    background:#e8636f;color:white;
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(232,99,111,0.45);}
    70%{box-shadow:0 0 0 12px rgba(232,99,111,0);}
    100%{box-shadow:0 0 0 0 rgba(232,99,111,0);}
  }
</style>
</head>

  const MATH_REGEX = /(-?\d+(?:\.\d+)?)\s*([+\-x\u00d7*/])\s*(-?\d+(?:\.\d+)?)/;

  // Languages that share vocabulary: if the detected one has no match, try
  // its siblings before giving up (e.g. Persian text that used no
  // Persian-only letter and was therefore detected as Arabic).
  const SIBLING_LANGS = {
    "ar": ["fa", "ur"],
    "fa": ["ar", "ur"],
    "ur": ["fa", "ar"],
    "ur_roman": ["hi_roman"],
    "hi_roman": ["ur_roman"]
  };

  const MAX_TRIGGER_WORDS = 5; // longest trigger phrase -- caps how many n-grams we ever build

  // Unicode ranges for script-based languages (deterministic, no guessing)
  const SCRIPT_RANGES = [
    ["hi", /[\u0900-\u097F]/],
    ["bn", /[\u0980-\u09FF]/],
    ["ru", /[\u0400-\u04FF]/],
    ["ja", /[\u3040-\u30FF]/],       // Hiragana/Katakana -- checked before CJK
    ["ko", /[\uAC00-\uD7A3]/],
    ["zh", /[\u4E00-\u9FFF]/],
    ["ARABIC_BLOCK", /[\u0600-\u06FF]/],
  ];
  const URDU_ONLY_CHARS = new Set("ٹڈڑںے");
  const PERSIAN_ONLY_CHARS = new Set("پچژگ");
  const LOWERCASED_LOOKUP_LANGS = new Set(["en","ur_roman","hi_roman","fr","es","de","it","pt","tr","id","sw"]);

  function detectLanguage(rawText){
    for(const [lang, pattern] of SCRIPT_RANGES){
      if(pattern.test(rawText)){
        if(lang === "ARABIC_BLOCK"){
          if([...rawText].some(ch => URDU_ONLY_CHARS.has(ch))) return "ur";
          if([...rawText].some(ch => PERSIAN_ONLY_CHARS.has(ch))) return "fa";
          return "ar";
        }
        return lang;
      }
    }
    const words = new Set(rawText.toLowerCase().split(/\s+/).filter(Boolean));
    let bestLang = "en", bestScore = 0;
    for(const [lang, sig] of Object.entries(LATIN_SIGNATURES)){
      const score = sig.filter(w => words.has(w)).length;
      if(score > bestScore){ bestLang = lang; bestScore = score; }
    }
    return bestLang;
  }

  // Every contiguous word-window in the message, LONGEST first, so a more
  // specific phrase ("kia ho raha") wins over a shorter coincidental match.
  function* generateNgrams(text, maxN = MAX_TRIGGER_WORDS){
    const words = text.split(/\s+/).filter(Boolean);
    const n = words.length;
    for(let size = Math.min(maxN, n); size >= 1; size--){
      for(let i = 0; i + size <= n; i++){
        yield words.slice(i, i + size).join(" ");
      }
    }
  }

  // Pure O(1) hash-map lookups -- .get()-equivalent per candidate n-gram,
  // never a linear scan over the rule set.
  // Returns {reply, lang} so the caller knows which voice to speak it in.
  function lookupResponse(rawText, lang){
    for(const candidate of [lang, ...(SIBLING_LANGS[lang] || [])]){
      const lookupText = LOWERCASED_LOOKUP_LANGS.has(candidate) ? rawText.toLowerCase().trim() : rawText.trim();
      const langDict = RESPONSES[candidate] || {};
      for(const ngram of generateNgrams(lookupText)){
        if(Object.prototype.hasOwnProperty.call(langDict, ngram)){
          return { reply: langDict[ngram], lang: candidate };
        }
      }
    }
    return { reply: FALLBACK[lang] || FALLBACK.en, lang };
  }

  // A goodbye only counts as a whole word in Latin-script languages,
  // so "maybe" is not read as "bye".
  function isExit(lookupText, lang){
    return (EXIT_WORDS[lang] || []).some(word => {
      if(!LOWERCASED_LOOKUP_LANGS.has(lang)) return lookupText.includes(word);
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp("(?<!\\w)" + escaped + "(?!\\w)").test(lookupText);
    });
  }

  function tryDynamic(rawText, lang){
    const clean = rawText.toLowerCase().trim();
    const raw = rawText.trim();

    if((TIME_TRIGGERS[lang] || []).some(p => clean.includes(p) || raw.includes(p))){
      const now = new Date();
      return `${TIME_PREFIX[lang] || TIME_PREFIX.en} ${now.toLocaleTimeString()}.`;
    }
    if((DATE_TRIGGERS[lang] || []).some(p => clean.includes(p) || raw.includes(p))){
      const now = new Date();
      return `${DATE_PREFIX[lang] || DATE_PREFIX.en} ${now.toLocaleDateString()}.`;
    }
    const m = raw.match(MATH_REGEX);
    if(m){
      const a = parseFloat(m[1]), op = m[2], b = parseFloat(m[3]);
      let result;
      if(op === '+') result = a + b;
      else if(op === '-') result = a - b;
      else if(op === 'x' || op === '\u00d7' || op === '*') result = a * b;
      else if(op === '/') result = b === 0 ? null : a / b;
      if(result === null) return (MATH_ANSWER_PREFIX[lang] || MATH_ANSWER_PREFIX.en) + " ... you can't divide by zero!";
      if(result !== undefined) return `${MATH_ANSWER_PREFIX[lang] || MATH_ANSWER_PREFIX.en} ${a} ${op} ${b} = ${result}.`;
    }
    return null;
  }

  // returns {lang, reply} so the caller knows which voice to speak the reply in
  function getResponse(rawText){
    const lang = detectLanguage(rawText);
    const clean = rawText.toLowerCase().trim();
    const raw = rawText.trim();
    const lookupText = LOWERCASED_LOOKUP_LANGS.has(lang) ? clean : raw;

    if(isExit(lookupText, lang)){
      return { lang, reply: EXIT_REPLY[lang] || EXIT_REPLY.en };
    }

    const dynamicReply = tryDynamic(rawText, lang);
    if(dynamicReply) return { lang, reply: dynamicReply };

    return lookupResponse(rawText, lang);
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const speakerBtn = document.getElementById('speakerBtn');
  const voiceLangSelect = document.getElementById('voiceLang');

  let speakerOn = true;

  function addMessage(text, sender){
    const row = document.createElement('div');
    row.className = 'row ' + sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  // ---- Text-to-speech (bot speaks its reply) ----
  function speak(text, langCode){
    if(!speakerOn) return;
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel(); // stop any reply still being read
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = LANG_TAGS[langCode] || 'en-US';
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }

  speakerBtn.addEventListener('click', ()=>{
    speakerOn = !speakerOn;
    speakerBtn.textContent = speakerOn ? '🔊' : '🔇';
    if(!speakerOn) window.speechSynthesis.cancel();
  });

  function handleSend(rawText){
    const text = rawText.trim();
    if(!text) return;
    addMessage(text, 'user');
    inputEl.value = '';

    showTyping();
    setTimeout(()=>{
      hideTyping();
      const { lang, reply } = getResponse(text);
      addMessage(reply, 'bot');
      speak(reply, lang);
    }, 450);
  }

  sendBtn.addEventListener('click', ()=> handleSend(inputEl.value));
  inputEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') handleSend(inputEl.value); });

  // ---- Speech-to-text (you speak, mic fills the input) ----
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  if(SpeechRecognitionAPI){
    recognition = new SpeechRecognitionAPI();
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (event)=>{
      const said = event.results[0][0].transcript;
      inputEl.value = said;
      handleSend(said);
    };
    recognition.onerror = ()=>{ stopListening(); };
    recognition.onend = ()=>{ stopListening(); };

    micBtn.addEventListener('click', ()=>{
      if(listening){ recognition.stop(); return; }
      recognition.lang = voiceLangSelect.value;
      try{
        recognition.start();
        listening = true;
        micBtn.classList.add('listening');
        micBtn.textContent = '⏺️';
      }catch(e){ /* already started */ }
    });
  } else {
    micBtn.addEventListener('click', ()=>{
      addMessage("Voice input isn't supported in this browser -- try Chrome or Edge.", 'bot');
    });
  }
